<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        h1 { text-align: center; color: #0056b3; }
        #products-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .product { border: 1px solid #ddd; background-color: #fff; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .product h2 { margin-top: 0; color: #0056b3; font-size: 1.5em; }
        .product .description { font-size: 0.9em; color: #666; margin-bottom: 10px; flex-grow: 1; }
        .product .price { font-weight: bold; color: #007bff; font-size: 1.1em; text-align: right; }
        .error-message { text-align: center; color: red; font-size: 1.2em; }
        .loading-message { text-align: center; color: #0056b3; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Our Products</h1>
    <div id="products-container">
        <p class="loading-message">Loading products...</p>
        <!-- Products will be loaded here by JavaScript -->
    </div>

    <script>
        function fetchAndDisplayProducts() {
            const container = document.getElementById('products-container');

            if (!container) {
                console.error('Error: products-container element not found.');
                document.body.innerHTML = '<p class="error-message">Critical error: Product display area not found.</p>';
                return;
            }

            // Display loading message before fetching
            container.innerHTML = '<p class="loading-message">Refreshing products...</p>';

            fetch('/api/products')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText} (status: ${response.status})`);
                    }
                    return response.json();
                })
                .then(products => {
                    container.innerHTML = ''; // Clear loading message or previous content
                    
                    if (!products || products.length === 0) {
                        container.innerHTML = '<p>No products available at this time.</p>';
                        return;
                    }

                    products.forEach(product => {
                        const productDiv = document.createElement('div');
                        productDiv.className = 'product';

                        const nameElement = document.createElement('h2');
                        nameElement.textContent = product.name || 'Unnamed Product';

                        const descriptionElement = document.createElement('p');
                        descriptionElement.className = 'description';
                        descriptionElement.textContent = product.description || 'No description available.';

                        const priceElement = document.createElement('p');
                        priceElement.className = 'price';
                        const price = parseFloat(product.price);
                        priceElement.textContent = `Price: $${!isNaN(price) ? price.toFixed(2) : 'N/A'}`;

                        productDiv.appendChild(nameElement);
                        productDiv.appendChild(descriptionElement);
                        productDiv.appendChild(priceElement);

                        container.appendChild(productDiv);
                    });
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                    container.innerHTML = `<p class="error-message">Error loading products: ${error.message}. Please try refreshing the page.</p>`;
                });
        }

        document.addEventListener('DOMContentLoaded', fetchAndDisplayProducts);

        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.altKey && event.shiftKey && (event.key === 'E' || event.key === 'e')) {
                event.preventDefault();
                console.log('CTRL+ALT+SHIFT+E pressed, refreshing product data...');
                fetchAndDisplayProducts();
            }
        });
    </script>
</body>
</html>
